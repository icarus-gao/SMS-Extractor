{% extends 'dashboard/base.html' %}

{% block title %}Edit Feature Group - {{ project.name }}{% endblock %}
{% block page_title %}Edit Feature Group{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0">Edit Feature Group: {{ group.group_name }}</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="group_name" class="form-label">Group Name *</label>
                        <input type="text" class="form-control" id="group_name" name="group_name" 
                               value="{{ group.group_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="2">{{ group.description }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="fields_json" class="form-label">Fields (JSON Array) *</label>
                        <textarea class="form-control font-monospace" id="fields_json" name="fields_json" 
                                  rows="4" required>{{ group.fields_json }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{% url 'dashboard:project-detail' project.project_id %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
