settings:
  list_delimiter: ";"
  unknown_token: "NA"
  evidence_required: true

enums:
  algorithm_family: [PBFT, Tendermint, HotStuff, DAG-based, other]
  module.commit_rule: [3-chain, 2-chain+TC, Tendermint-style, DAG-ordered, other]
  module.view_change: [linear, quadratic, optimistic, other]
  module.leader_selection: [round-robin, VRF/lottery, stake-weighted, other]
  module.batching_policy: [fixed, adaptive, none]
  module.data_availability: [none, erasure-coding, DA-committee, other]
  module.sig_scheme: [Ed25519, BLS12-381, secp256k1, other]

fields:
  - {name: paper_id, type: str, required: true}
  - {name: title, type: str}
  - {name: year, type: int}
  - {name: doi, type: str}
  - {name: algorithm_name, type: str}
  - {name: algorithm_family, type: str, enum: algorithm_family}
  - {name: lineage.ancestor_list, type: list}
  - {name: module.commit_rule, type: str, enum: module.commit_rule}
  - {name: module.view_change, type: str, enum: module.view_change}
  - {name: module.leader_selection, type: str, enum: module.leader_selection}
  - {name: module.leader_rotation, type: bool}
  - {name: module.pipelining, type: bool}
  - {name: module.batching_policy, type: str, enum: module.batching_policy}
  - {name: module.fast_path, type: bool}
  - {name: module.dag_decoupling, type: bool}
  - {name: module.data_availability, type: str, enum: module.data_availability}
  - {name: module.sig_scheme, type: str, enum: module.sig_scheme}
  - {name: module.threshold_sigs, type: bool}
  - {name: module.aggregate_sigs, type: bool}
  - {name: comm_complexity_normal, type: str}

evidence_record:
  fields: [paper_id, field, value, quote, location]
