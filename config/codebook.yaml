settings:
  list_delimiter: ";"
  unknown_token: "NA"
  evidence_required: true

enums:
  boolean: [true, false]
  desc.doc_type: [survey, sms, slr, methodology, tutorial, taxonomy-survey, benchmark-survey, protocol, system, framework, dataset-benchmark, position]
  desc.venue_type: [conference, journal, workshop, thesis, tech-report, arxiv]
  desc.domain_scope: [generic, blockchain-permissioned, blockchain-public, consortium, iot-edge, finance, healthcare, other]
  desc.study_goal: [taxonomy-mapping, performance-eval, robustness-eval, limits-analysis, modeling, case-study]
  desc.methodology_tags: [PRISMA, SMS, SLR, formal-proof, artifact-eval]
  desc.novelty_type: [new-protocol, new-system, new-analysis, new-attack, new-defense, new-metric, none]
  desc.evaluation_type: [real-cluster, cloud, emulator, simulation, none]
  survey.method_class: [narrative-review, scoping-review, sms, slr, umbrella-review, taxonomy-survey, benchmark-survey, methodology, tutorial]
  research.primary_type: [protocol, system, framework, analysis-modeling, attack, defense, benchmark-dataset, measurement, replication-negative, methodology-tooling]
  research.secondary_tags: [new-attack, new-defense, new-metric, modeling, formal-proof, empirical, simulation, benchmark]
  research.validation_level: [theory-only, prototype, empirical-eval, production-like]
  algorithm_family: [PBFT, Tendermint, HotStuff, HotStuff-2, DAG-based, SBFT, QBFT, other]
  network_type: [sync, partial, async]
  failure_model: [crash, byzantine, mixed]
  adversary_type: [static, adaptive]
  module.sig_scheme: [Ed25519, BLS12-381, secp256k1, other]
  module.commit_rule: [3-chain, 2-chain+TC, Tendermint-style, DAG-ordered, other]
  module.view_change: [linear, quadratic, optimistic, other]
  module.leader_selection: [round-robin, VRF/lottery, stake-weighted, reputation, other]
  module.batching_policy: [fixed, adaptive, none]
  module.data_availability: [none, erasure-coding, DA-committee, DAS, other]
  evaluation_env: [real cluster, cloud, emulator, simulation]
  workload_type: [synthetic, real-trace, mixed]
  baseline_type: [HotStuff, same-domain, none, other]
  proof_method: [invariant-based, by-reduction, TLA+, I/O-automata, temporal-logic, model-checking, other]
  artifact_reuse_ready: [code+container+data, code+container, code-only, none]
  bottleneck_primary: [signature-verify, leader-CPU, network-NIC, DA/erasure, mempool/ordering, view-change, storage-IO, other]
  bottleneck_evidence: [profile-CPU, NIC-utilization, ablation-study, microbench, sensitivity-analysis]
  iot.class: [MCU-class, SBC-class, phone-class, gateway, mixed]
  iot.crypto_accel: [none, AES, SHA, ECC, general]
  intermittency_pattern: [periodic-sleep, event-driven, opportunistic, mobile]
  extraction_status: [draft, double-coded, resolved]
  model_validation: [proof-only, proof+sim, proof+real-experiment]
  venue.trust_rating: [top-tier, reputable, average, questionable, predatory-suspected, unknown]
  module.quorum_system: [2f+1, 3f+1, flexible-quorums, weighted-stake, other]
  module.pacemaker_type: [timeout, paced, vr-based, other]
  module.fast_path_type: [none, optimistic-responsiveness, speculative, two-track, other]
  module.dag_type: [single-leader-DAG, multi-leader-DAG, narwhal-tusk-like, aleph-like, other]
  module.mempool_ordering: [fifo, fair, priority, other]
  crypto.multi_sig_type: [BLS-agg, threshold-BLS, CoSi, MuSig, other]
  crypto.pq_support: [none, experimental, production-like]
  crypto.zk_usage: [none, proofs-of-custody, availability, other]
  attack.catalog: [equivocation, double-vote, censorship, dos-leader, dos-network, message-replay, view-change-abuse, leader-rotation-manipulation, adaptive-corruption, long-range, key-compromise, timeout-manipulation, other]
  attacker.sim: [none, fault-injection, byzantine-scheduler, network-partition, equivocation-injector, key-rotate, dos, other]
  iot.link_layer: [BLE, ZigBee, LoRa, WiFi, LTE, 5G, Ethernet, other]
  iot.reliability_target: [three-nines, four-nines, five-nines, other]
  iot.crypto_offload: [none, HSM, TPM, secure-element, GPU, FPGA, other]
  metric.set: [tps, latency, commit-rate, cpu, nic, mem, disk, fairness-index]

fields:
  - {name: paper_id, type: str, required: true}
  - {name: title, type: str}
  - {name: year, type: int}
  - {name: venue, type: str}
  - {name: venue.trust_rating, type: str, enum: venue.trust_rating}
  - {name: doi, type: str}
  - {name: url, type: str}
  - {name: open_access, type: bool}
  - {name: desc.doc_type, type: str, enum: desc.doc_type}
  - {name: desc.venue_type, type: str, enum: desc.venue_type}
  - {name: desc.peer_reviewed, type: bool}
  - {name: desc.publication_year, type: int}
  - {name: desc.domain_scope, type: str, enum: desc.domain_scope}
  - {name: desc.study_goal, type: list, enum: desc.study_goal}
